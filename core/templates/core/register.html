{% extends 'core/base.html' %}
{% load static %}

{% block title %}Đăng ký{% endblock %}

{% block extra_css %}
<style>
    .login-wrapper {
        display: grid;
        place-items: center;
        min-height: calc(100vh - 160px);
        padding: 24px;
    }
    .auth-card {
        width: min(420px, 100%);
    }
    h2 {
        font-family: "Playfair Display", serif;
        font-size: 28px;
        margin: 0 0 6px;
    }
    .subtitle {
        color: var(--muted);
        margin: 0 0 20px;
        font-size: 14px;
    }
    .field {
        display: flex;
        flex-direction: column;
        gap: 8px;
        margin-bottom: 14px;
    }
    label {
        font-weight: 600;
        font-size: 14px;
    }
    input {
        padding: 11px 12px;
        border-radius: 12px;
        border: 1px solid rgba(31, 42, 43, 0.18);
        font-family: inherit;
        font-size: 14px;
        outline: none;
        transition: border 0.2s ease, box-shadow 0.2s ease;
    }
    input:focus {
        border-color: var(--primary);
        box-shadow: 0 0 0 3px var(--ring);
    }
    .password-wrap {
        position: relative;
        width: 100%;
    }
    .password-wrap input {
        width: 100%;
        display: block;
        padding-right: 48px;
    }
    .password-wrap input::-ms-reveal,
    .password-wrap input::-ms-clear {
        display: none;
    }
    .toggle-password {
        position: absolute;
        right: 8px;
        top: 50%;
        transform: translateY(-50%);
        width: 32px;
        height: 32px;
        border: none;
        background: transparent;
        color: #1f2a2b;
        border-radius: 50%;
        padding: 0;
        cursor: pointer;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        z-index: 2;
    }
    .toggle-password:hover {
        background: #f4f8f7;
    }
    .toggle-password:focus {
        outline: 2px solid var(--ring);
        outline-offset: 1px;
    }
    .toggle-password svg {
        width: 18px;
        height: 18px;
        display: block;
    }
    .toggle-password .icon-eye-off {
        display: none;
    }
    .toggle-password.is-visible .icon-eye {
        display: none;
    }
    .toggle-password.is-visible .icon-eye-off {
        display: block;
    }
    .sr-only {
        position: absolute;
        width: 1px;
        height: 1px;
        padding: 0;
        margin: -1px;
        overflow: hidden;
        clip: rect(0, 0, 0, 0);
        border: 0;
        white-space: nowrap;
    }
    .auth-btn {
        width: 100%;
        padding: 12px 14px;
        font-size: 15px;
    }
    .footer {
        margin-top: 16px;
        text-align: center;
        font-size: 14px;
        color: var(--muted);
    }
    .footer a {
        color: var(--primary);
        text-decoration: none;
        font-weight: 600;
    }
    .text-danger {
        color: #d9534f;
        font-size: 12px;
        margin-top: -8px;
        margin-bottom: 8px;
    }
</style>
{% endblock %}

{% block content %}
<div class="login-wrapper">
    <div class="card auth-card">
        <h2>Đăng ký tài khoản</h2>
        <p class="subtitle">Tạo tài khoản bệnh nhân mới</p>

        <form method="post" action="{% url 'register' %}" class="needs-validation" novalidate>
            {% csrf_token %}
            <div class="field">
                <label for="username">Tên đăng nhập *</label>
                <input type="text" id="username" name="username" required value="{{ form_data.username|default:'' }}">
            </div>
            
            <div class="field">
                <label for="password">Mật khẩu *</label>
                <div class="password-wrap">
                    <input type="password" id="password" name="password" required>
                    <button type="button" class="toggle-password" id="togglePassword" aria-label="Hiện mật khẩu">
                        <svg class="icon-eye" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                            <circle cx="12" cy="12" r="3"></circle>
                        </svg>
                        <svg class="icon-eye-off" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path>
                            <line x1="1" y1="1" x2="23" y2="23"></line>
                        </svg>
                        <span class="sr-only">Hiện/Ẩn mật khẩu</span>
                    </button>
                </div>
            </div>

            <div class="field">
                <label for="confirm_password">Xác nhận mật khẩu *</label>
                <div class="password-wrap">
                    <input type="password" id="confirm_password" name="confirm_password" required>
                    <button type="button" class="toggle-password" id="toggleConfirmPassword" aria-label="Hiện mật khẩu">
                        <svg class="icon-eye" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                            <circle cx="12" cy="12" r="3"></circle>
                        </svg>
                        <svg class="icon-eye-off" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path>
                            <line x1="1" y1="1" x2="23" y2="23"></line>
                        </svg>
                        <span class="sr-only">Hiện/Ẩn mật khẩu</span>
                    </button>
                </div>
            </div>

            <div class="field">
                <label for="ho_ten">Họ và tên *</label>
                <input type="text" id="ho_ten" name="ho_ten" required value="{{ form_data.ho_ten|default:'' }}">
            </div>

            <div class="field">
                <label for="so_dien_thoai">Số điện thoại *</label>
                <input type="text" id="so_dien_thoai" name="so_dien_thoai" required value="{{ form_data.so_dien_thoai|default:'' }}">
            </div>

                        <div class="field">
                <label for="ngay_sinh">Ngày sinh *</label>
                <input type="date" id="ngay_sinh" name="ngay_sinh" required value="{{ form_data.ngay_sinh|default:'' }}">
            </div>

            <div class="field">
                <label for="gioi_tinh">Giới tính *</label>
                <select id="gioi_tinh" name="gioi_tinh" required style="padding: 11px 12px; border-radius: 12px; border: 1px solid rgba(31, 42, 43, 0.18); font-family: inherit; font-size: 14px; outline: none; transition: border 0.2s ease, box-shadow 0.2s ease; background: white;">
                    <option value="" {% if not form_data.gioi_tinh %}selected{% endif %}>Chọn giới tính</option>
                    <option value="Nam" {% if form_data.gioi_tinh == 'Nam' %}selected{% endif %}>Nam</option>
                    <option value="Nữ" {% if form_data.gioi_tinh == 'Nữ' %}selected{% endif %}>Nữ</option>
                </select>
            </div>

            <div class="field">
                <label for="dia_chi">Địa chỉ *</label>
                <input type="text" id="dia_chi" name="dia_chi" required value="{{ form_data.dia_chi|default:'' }}">
            </div>

<div class="field">
                <label for="email">Email</label>
                <input type="email" id="email" name="email" value="{{ form_data.email|default:'' }}">
            </div>

            <button type="submit" class="btn primary auth-btn">Đăng ký</button>
        </form>

        <div class="footer">
            <p>Đã có tài khoản? <a href="{% url 'login' %}">Đăng nhập</a></p>
        </div>
    </div>
</div>
{% endblock %}

{% block extra_js %}
<script>
    document.addEventListener("DOMContentLoaded", function() {
        function setupToggle(btnId, inputId) {
            const btn = document.getElementById(btnId);
            const input = document.getElementById(inputId);
            if (btn && input) {
                btn.addEventListener("click", function () {
                    const type = input.getAttribute("type") === "password" ? "text" : "password";
                    input.setAttribute("type", type);
                    this.classList.toggle("is-visible");
                    if (type === "text") {
                        this.setAttribute("aria-label", "Ẩn mật khẩu");
                    } else {
                        this.setAttribute("aria-label", "Hiện mật khẩu");
                    }
                });
            }
        }
        setupToggle("togglePassword", "password");
        setupToggle("toggleConfirmPassword", "confirm_password");
    });
</script>
<script src="{% static 'core/js/form_validation_vi.js' %}"></script>
{% endblock %}
