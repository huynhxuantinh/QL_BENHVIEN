<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Kh&#225;m b&#7879;nh</title>
    <style>
        @import url("https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Work+Sans:wght@400;500;600&display=swap");

        :root {
            --bg-1: #f6f3ee;
            --bg-2: #eef4f0;
            --ink: #1f2a2b;
            --muted: #5b6b6a;
            --primary: #0b6b5b;
            --primary-2: #0f8a74;
            --card: #ffffff;
            --shadow: 0 18px 50px rgba(25, 35, 34, 0.12);
        }

        * { box-sizing: border-box; }

        body {
            margin: 0;
            font-family: "Work Sans", "Segoe UI", sans-serif;
            color: var(--ink);
            background:
                radial-gradient(1200px 600px at 85% -10%, rgba(15, 138, 116, 0.16), transparent 60%),
                radial-gradient(900px 500px at -10% 20%, rgba(242, 197, 124, 0.18), transparent 60%),
                linear-gradient(120deg, var(--bg-1), var(--bg-2));
            min-height: 100vh;
        }

        .page {
            max-width: 900px;
            margin: 0 auto;
            padding: 28px 20px 60px;
        }

        .card {
            background: var(--card);
            padding: 22px;
            border-radius: 20px;
            border: 1px solid rgba(31, 42, 43, 0.08);
            box-shadow: var(--shadow);
        }

        .field {
            display: flex;
            flex-direction: column;
            gap: 8px;
            margin-bottom: 14px;
        }

        .field label {
            font-weight: 600;
            font-size: 14px;
        }

        .field textarea {
            padding: 10px 12px;
            border-radius: 12px;
            border: 1px solid rgba(31, 42, 43, 0.18);
            font-family: inherit;
            font-size: 14px;
            min-height: 110px;
            resize: vertical;
        }

        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            padding: 10px 16px;
            border-radius: 999px;
            text-decoration: none;
            font-weight: 600;
            font-size: 14px;
            border: 1px solid transparent;
            white-space: nowrap;
        }

        .btn.primary {
            background: var(--primary);
            color: #fff;
            box-shadow: 0 10px 18px rgba(11, 107, 91, 0.25);
        }

        .btn.ghost {
            color: var(--primary);
            border-color: rgba(11, 107, 91, 0.3);
            background: rgba(255, 255, 255, 0.9);
        }
    </style>
</head>
<body>
    <div class="page">
        <div class="card">
            <h2 style="margin-top:0;">Kh&#225;m b&#7879;nh</h2>
            <p style="color:var(--muted);">
                B&#7879;nh nh&#226;n: <strong>{{ lich.benh_nhan.ho_ten }}</strong> &#8212;
                Ng&#224;y {{ lich.ngay_kham|date:"d/m/Y" }} l&#250;c {{ lich.gio_kham|time:"H\hi" }}
                ({% with h=lich.gio_kham|time:"H" %}{% if h < "12" %}s&#225;ng{% elif h < "18" %}chi&#7873;u{% else %}t&#7889;i{% endif %}{% endwith %})
            </p>

            <form method="post">
                {% csrf_token %}

                <div class="field">
                    <label>Tri&#7879;u ch&#7913;ng</label>
                    <textarea name="trieu_chung" required></textarea>
                </div>

                <div class="field">
                    <label>Ch&#7849;n &#273;o&#225;n</label>
                    <textarea name="chan_doan" required></textarea>
                </div>

                <div class="field">
                    <label>H&#432;&#7899;ng &#273;i&#7873;u tr&#7883;</label>
                    <textarea name="huong_dieu_tri" required></textarea>
                </div>

                <div style="display:flex; gap:10px; flex-wrap:wrap;">
                    <button class="btn primary" type="submit">Ho&#224;n th&#224;nh kh&#225;m</button>
                    <a class="btn ghost" href="{% url 'bac_si_home' %}">Quay l&#7841;i</a>
                </div>
            </form>
        </div>
    </div>
</body>
</html>
