{% load static %}
<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>&#272;&#259;ng k&#253;</title>
    <style>
        @import url("https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Work+Sans:wght@400;500;600&display=swap");

        :root {
            --bg-1: #f6f3ee;
            --bg-2: #eef4f0;
            --ink: #1f2a2b;
            --muted: #5b6b6a;
            --primary: #0b6b5b;
            --primary-2: #0f8a74;
            --card: #ffffff;
            --ring: rgba(11, 107, 91, 0.18);
            --shadow: 0 18px 50px rgba(25, 35, 34, 0.12);
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: "Work Sans", "Segoe UI", sans-serif;
            color: var(--ink);
            background:
                radial-gradient(1200px 600px at 85% -10%, rgba(15, 138, 116, 0.16), transparent 60%),
                radial-gradient(900px 500px at -10% 20%, rgba(242, 197, 124, 0.18), transparent 60%),
                linear-gradient(120deg, var(--bg-1), var(--bg-2));
            min-height: 100vh;
            display: grid;
            place-items: center;
            padding: 24px;
        }

        .card {
            width: min(420px, 100%);
            background: var(--card);
            padding: 28px;
            border-radius: 22px;
            box-shadow: var(--shadow);
            border: 1px solid rgba(31, 42, 43, 0.08);
        }

        h2 {
            font-family: "Playfair Display", serif;
            font-size: 28px;
            margin: 0 0 6px;
        }

        .subtitle {
            color: var(--muted);
            margin: 0 0 20px;
            font-size: 14px;
        }

        .field {
            display: flex;
            flex-direction: column;
            gap: 8px;
            margin-bottom: 14px;
        }

        label {
            font-weight: 600;
            font-size: 14px;
        }

        input {
            padding: 11px 12px;
            border-radius: 12px;
            border: 1px solid rgba(31, 42, 43, 0.18);
            font-family: inherit;
            font-size: 14px;
            outline: none;
            transition: border 0.2s ease, box-shadow 0.2s ease;
        }

        input:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 3px var(--ring);
        }
        .password-wrap {
            position: relative;
            width: 100%;
        }
        .password-wrap input {
            width: 100%;
            display: block;
            padding-right: 48px;
        }
        .password-wrap input::-ms-reveal,
        .password-wrap input::-ms-clear {
            display: none;
        }
        .toggle-password {
            position: absolute;
            right: 8px;
            top: 50%;
            transform: translateY(-50%);
            width: 32px;
            height: 32px;
            border: none;
            background: transparent;
            color: #1f2a2b;
            border-radius: 50%;
            padding: 0;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            z-index: 2;
        }
        .toggle-password:hover {
            background: #f4f8f7;
        }
        .toggle-password:focus {
            outline: 2px solid var(--ring);
            outline-offset: 1px;
        }
        .toggle-password svg {
            width: 18px;
            height: 18px;
            display: block;
        }
        .toggle-password .icon-eye-off {
            display: none;
        }
        .toggle-password.is-visible .icon-eye {
            display: none;
        }
        .toggle-password.is-visible .icon-eye-off {
            display: block;
        }
        .sr-only {
            position: absolute;
            width: 1px;
            height: 1px;
            padding: 0;
            margin: -1px;
            overflow: hidden;
            clip: rect(0, 0, 0, 0);
            border: 0;
            white-space: nowrap;
        }

        .btn {
            width: 100%;
            padding: 12px 14px;
            border: none;
            border-radius: 999px;
            background: var(--primary);
            color: #fff;
            font-weight: 600;
            font-size: 15px;
            cursor: pointer;
            transition: transform 0.2s ease, background 0.2s ease;
        }

        .btn:hover {
            background: var(--primary-2);
            transform: translateY(-1px);
        }

        .footer {
            margin-top: 16px;
            text-align: center;
            font-size: 14px;
            color: var(--muted);
        }

        .footer a {
            color: var(--primary);
            text-decoration: none;
            font-weight: 600;
        }

        .messages {
            margin-bottom: 14px;
            display: grid;
            gap: 8px;
        }

        .message {
            padding: 10px 12px;
            border-radius: 10px;
            font-size: 14px;
            border: 1px solid transparent;
            background: rgba(255, 255, 255, 0.9);
        }

        .message.error {
            border-color: rgba(180, 52, 52, 0.5);
            color: #9d2c2c;
        }

        .message.success {
            border-color: rgba(11, 107, 91, 0.4);
            color: var(--primary);
        }
    </style>
</head>
<body>
    <div class="card">
        <h2>&#272;&#259;ng k&#253;</h2>
        <p class="subtitle">T&#7841;o t&#224;i kho&#7843;n b&#7857;ng t&#234;n ng&#432;&#7901;i d&#249;ng</p>

        {% if messages %}
            <div class="messages">
                {% for message in messages %}
                    <div class="message {{ message.tags }}">{{ message }}</div>
                {% endfor %}
            </div>
        {% endif %}

        <form method="post">
            {% csrf_token %}

            <div class="field">
                <label>H&#7885; t&#234;n</label>
                <input name="name" placeholder="Nh&#7853;p h&#7885; t&#234;n">
            </div>

            <div class="field">
                <label>T&#234;n ng&#432;&#7901;i d&#249;ng</label>
                <input name="username" placeholder="V&#237; d&#7909;: user123 (kh&#244;ng d&#7845;u, kh&#244;ng kho&#7843;ng tr&#7855;ng)" autocomplete="username">
            </div>

            <div class="field">
                <label>Email</label>
                <input name="email" type="email" placeholder="Nh&#7853;p email" autocomplete="email">
            </div>

            <div class="field">
                <label>S&#7889; &#273;i&#7879;n tho&#7841;i</label>
                <input name="so_dien_thoai" placeholder="Nh&#7853;p s&#7889; &#273;i&#7879;n tho&#7841;i"
                       pattern="0\d{9}" maxlength="10" inputmode="numeric"
                       title="S&#7889; &#273;i&#7879;n tho&#7841;i g&#7891;m &#273;&#250;ng 10 ch&#7919; s&#7889; v&#224; b&#7855;t &#273;&#7847;u b&#7857;ng 0.">
            </div>

            <div class="field">
                <label>Ngày sinh</label>
                <input type="date" name="ngay_sinh" required>
            </div>

            <div class="field">
                <label>Giới tính</label>
                <select name="gioi_tinh" required style="padding: 11px 12px; border-radius: 12px; border: 1px solid rgba(31, 42, 43, 0.18); font-family: inherit; font-size: 14px; outline: none; background: white;">
                    <option value="" disabled selected>Chọn giới tính</option>
                    <option value="nam">Nam</option>
                    <option value="nu">Nữ</option>
                    <option value="khac">Khác</option>
                </select>
            </div>

            <div class="field">
                <label>Địa chỉ</label>
                <input type="text" name="dia_chi" placeholder="Nhập địa chỉ của bạn" required>
            </div>

            <div class="field">
                <label>M&#7853;t kh&#7849;u</label>
                <div class="password-wrap">
                    <input
                        id="register-password"
                        name="password"
                        type="password"
                        placeholder="T&#7841;o m&#7853;t kh&#7849;u"
                        autocomplete="new-password"
                    >
                    <button
                        id="toggle-register-password"
                        class="toggle-password"
                        type="button"
                        data-toggle-password
                        data-target="register-password"
                        aria-controls="register-password"
                        aria-label="Hi&#7879;n m&#7853;t kh&#7849;u"
                    >
                        <svg class="icon-eye" viewBox="0 0 24 24" aria-hidden="true">
                            <path fill="currentColor" d="M12 5c5.23 0 9.27 3.11 11 7-1.73 3.89-5.77 7-11 7S2.73 15.89 1 12c1.73-3.89 5.77-7 11-7Zm0 2C8.2 7 5.1 9.17 3.2 12 5.1 14.83 8.2 17 12 17s6.9-2.17 8.8-5C18.9 9.17 15.8 7 12 7Zm0 2.5A2.5 2.5 0 1 1 9.5 12 2.5 2.5 0 0 1 12 9.5Z"/>
                        </svg>
                        <svg class="icon-eye-off" viewBox="0 0 24 24" aria-hidden="true">
                            <path fill="currentColor" d="m2.7 3.76 17.54 17.55-1.41 1.41-3.2-3.2A11.86 11.86 0 0 1 12 19c-5.23 0-9.27-3.11-11-7a12.7 12.7 0 0 1 4.13-4.95L1.29 5.17 2.7 3.76Zm3.89 4.3A9.62 9.62 0 0 0 3.2 12c1.9 2.83 5 5 8.8 5 .95 0 1.86-.14 2.71-.4l-1.8-1.8a3.5 3.5 0 0 1-4.7-4.7L6.59 8.06ZM12 5c5.23 0 9.27 3.11 11 7a12.72 12.72 0 0 1-4.08 4.92l-1.44-1.44A9.58 9.58 0 0 0 20.8 12c-1.9-2.83-5-5-8.8-5-1 0-1.95.15-2.82.43L7.53 5.78A11.68 11.68 0 0 1 12 5Zm-.35 4.01a2.5 2.5 0 0 1 3.34 3.34l-3.34-3.34Z"/>
                        </svg>
                        <span class="sr-only">Hi&#7879;n / &#7848;n m&#7853;t kh&#7849;u</span>
                    </button>
                </div>
            </div>

            <div class="field">
                <label>X&#225;c nh&#7853;n m&#7853;t kh&#7849;u</label>
                <div class="password-wrap">
                    <input
                        id="register-confirm-password"
                        name="confirm_password"
                        type="password"
                        placeholder="Nh&#7853;p l&#7841;i m&#7853;t kh&#7849;u"
                        autocomplete="new-password"
                    >
                    <button
                        class="toggle-password"
                        type="button"
                        data-toggle-password
                        data-target="register-confirm-password"
                        aria-controls="register-confirm-password"
                        aria-label="Hi&#7879;n m&#7853;t kh&#7849;u"
                    >
                        <svg class="icon-eye" viewBox="0 0 24 24" aria-hidden="true">
                            <path fill="currentColor" d="M12 5c5.23 0 9.27 3.11 11 7-1.73 3.89-5.77 7-11 7S2.73 15.89 1 12c1.73-3.89 5.77-7 11-7Zm0 2C8.2 7 5.1 9.17 3.2 12 5.1 14.83 8.2 17 12 17s6.9-2.17 8.8-5C18.9 9.17 15.8 7 12 7Zm0 2.5A2.5 2.5 0 1 1 9.5 12 2.5 2.5 0 0 1 12 9.5Z"/>
                        </svg>
                        <svg class="icon-eye-off" viewBox="0 0 24 24" aria-hidden="true">
                            <path fill="currentColor" d="m2.7 3.76 17.54 17.55-1.41 1.41-3.2-3.2A11.86 11.86 0 0 1 12 19c-5.23 0-9.27-3.11-11-7a12.7 12.7 0 0 1 4.13-4.95L1.29 5.17 2.7 3.76Zm3.89 4.3A9.62 9.62 0 0 0 3.2 12c1.9 2.83 5 5 8.8 5 .95 0 1.86-.14 2.71-.4l-1.8-1.8a3.5 3.5 0 0 1-4.7-4.7L6.59 8.06ZM12 5c5.23 0 9.27 3.11 11 7a12.72 12.72 0 0 1-4.08 4.92l-1.44-1.44A9.58 9.58 0 0 0 20.8 12c-1.9-2.83-5-5-8.8-5-1 0-1.95.15-2.82.43L7.53 5.78A11.68 11.68 0 0 1 12 5Zm-.35 4.01a2.5 2.5 0 0 1 3.34 3.34l-3.34-3.34Z"/>
                        </svg>
                        <span class="sr-only">Hi&#7879;n / &#7848;n m&#7853;t kh&#7849;u</span>
                    </button>
                </div>
            </div>

            <button class="btn" type="submit">&#272;&#259;ng k&#253;</button>
        </form>

        <div class="footer">
            &#272;&#227; c&#243; t&#224;i kho&#7843;n? <a href="/login/">&#272;&#259;ng nh&#7853;p</a>
        </div>
    </div>
    <script src="{% static 'core/js/form_validation_vi.js' %}"></script>
    <script>
        (function () {
            const toggleButtons = document.querySelectorAll("[data-toggle-password]");
            toggleButtons.forEach((btn) => {
                const targetId = btn.getAttribute("data-target");
                const input = targetId ? document.getElementById(targetId) : null;
                if (!input) {
                    return;
                }
                btn.addEventListener("click", function () {
                    const visible = input.type === "password";
                    input.type = visible ? "text" : "password";
                    btn.classList.toggle("is-visible", visible);
                    btn.setAttribute("aria-label", visible ? "Ẩn mật khẩu" : "Hiện mật khẩu");
                });
            });
        })();
    </script>
</body>
</html>
