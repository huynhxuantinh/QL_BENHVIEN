<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Qu&#234;n m&#7853;t kh&#7849;u</title>
    <style>
        @import url("https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Work+Sans:wght@400;500;600&display=swap");

        :root {
            --bg-1: #f6f3ee;
            --bg-2: #eef4f0;
            --ink: #1f2a2b;
            --muted: #5b6b6a;
            --primary: #0b6b5b;
            --primary-2: #0f8a74;
            --card: #ffffff;
            --ring: rgba(11, 107, 91, 0.18);
            --shadow: 0 18px 50px rgba(25, 35, 34, 0.12);
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: "Work Sans", "Segoe UI", sans-serif;
            color: var(--ink);
            background:
                radial-gradient(1200px 600px at 85% -10%, rgba(15, 138, 116, 0.16), transparent 60%),
                radial-gradient(900px 500px at -10% 20%, rgba(242, 197, 124, 0.18), transparent 60%),
                linear-gradient(120deg, var(--bg-1), var(--bg-2));
            min-height: 100vh;
            display: grid;
            place-items: center;
            padding: 24px;
        }

        .card {
            width: min(420px, 100%);
            background: var(--card);
            padding: 28px;
            border-radius: 22px;
            box-shadow: var(--shadow);
            border: 1px solid rgba(31, 42, 43, 0.08);
        }

        h2 {
            font-family: "Playfair Display", serif;
            font-size: 28px;
            margin: 0 0 6px;
        }

        .subtitle {
            color: var(--muted);
            margin: 0 0 20px;
            font-size: 14px;
        }

        .field {
            display: flex;
            flex-direction: column;
            gap: 8px;
            margin-bottom: 14px;
        }

        label {
            font-weight: 600;
            font-size: 14px;
        }

        input {
            padding: 11px 12px;
            border-radius: 12px;
            border: 1px solid rgba(31, 42, 43, 0.18);
            font-family: inherit;
            font-size: 14px;
            outline: none;
            transition: border 0.2s ease, box-shadow 0.2s ease;
        }

        input:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 3px var(--ring);
        }

        .btn {
            width: 100%;
            padding: 12px 14px;
            border: none;
            border-radius: 999px;
            background: var(--primary);
            color: #fff;
            font-weight: 600;
            font-size: 15px;
            cursor: pointer;
            transition: transform 0.2s ease, background 0.2s ease;
        }

        .btn:hover {
            background: var(--primary-2);
            transform: translateY(-1px);
        }

        .footer {
            margin-top: 16px;
            text-align: center;
            font-size: 14px;
            color: var(--muted);
        }

        .footer a {
            color: var(--primary);
            text-decoration: none;
            font-weight: 600;
        }

        .messages {
            margin-bottom: 14px;
            display: grid;
            gap: 8px;
        }

        .message {
            padding: 10px 12px;
            border-radius: 10px;
            font-size: 14px;
            border: 1px solid transparent;
            background: rgba(255, 255, 255, 0.9);
        }

        .message.error {
            border-color: rgba(180, 52, 52, 0.5);
            color: #9d2c2c;
        }

        .message.success {
            border-color: rgba(11, 107, 91, 0.4);
            color: var(--primary);
        }
    </style>
</head>
<body>
    <div class="card">
        <h2>Qu&#234;n m&#7853;t kh&#7849;u</h2>
        <p class="subtitle">Nh&#7853;p S&#272;T v&#224; email &#273;&#227; &#273;&#259;ng k&#253; &#273;&#7875; &#273;&#7863;t l&#7841;i m&#7853;t kh&#7849;u.</p>

        {% if messages %}
            <div class="messages">
                {% for message in messages %}
                    <div class="message {{ message.tags }}">{{ message }}</div>
                {% endfor %}
            </div>
        {% endif %}

        <form method="post">
            {% csrf_token %}

            <div class="field">
                <label>S&#7889; &#273;i&#7879;n tho&#7841;i</label>
                <input name="username" placeholder="Nh&#7853;p s&#7889; &#273;i&#7879;n tho&#7841;i" autocomplete="tel">
            </div>

            <div class="field">
                <label>Email</label>
                <input name="email" type="email" placeholder="Nh&#7853;p email" autocomplete="email">
            </div>

            <div class="field">
                <label>M&#7853;t kh&#7849;u m&#7899;i</label>
                <input name="new_password" type="password" placeholder="M&#7853;t kh&#7849;u m&#7899;i" autocomplete="new-password">
            </div>

            <div class="field">
                <label>Nh&#7853;p l&#7841;i m&#7853;t kh&#7849;u</label>
                <input name="confirm_password" type="password" placeholder="Nh&#7853;p l&#7841;i m&#7853;t kh&#7849;u" autocomplete="new-password">
            </div>

            <button class="btn" type="submit">&#272;&#7893;i m&#7853;t kh&#7849;u</button>
        </form>

        <div class="footer">
            Quay l&#7841;i <a href="{% url 'login' %}">&#272;&#259;ng nh&#7853;p</a>
        </div>
    </div>
</body>
</html>
