<!DOCTYPE html>
{% load static %}
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Quản trị hệ thống{% endblock %}</title>
    <link rel="icon" type="image/png" href="{% static 'core/img/benh-vien-3t-logo.png' %}">
    <link rel="apple-touch-icon" href="{% static 'core/img/benh-vien-3t-logo.png' %}">
    <link rel="stylesheet" href="{% static 'core/css/admin.css' %}">
    <style>
        {% block extra_css %}{% endblock %}
    </style>
    {% block extra_head %}{% endblock %}
</head>
<body>
    <div class="page">
        {% block content %}{% endblock %}
    </div>
    <script>
        document.addEventListener('submit', function(e) {
            if (e.target.tagName === 'FORM') {
                const submitBtn = e.target.querySelector('button[type="submit"]');
                if (submitBtn) {
                    if (submitBtn.dataset.submitting) {
                        e.preventDefault();
                        return;
                    }
                    submitBtn.dataset.submitting = 'true';
                    submitBtn.style.opacity = '0.7';
                    submitBtn.style.pointerEvents = 'none';
                    if (!submitBtn.innerHTML.includes('<svg') && !submitBtn.innerHTML.includes('<img')) {
                        submitBtn.innerHTML = 'Đang xử lý...';
                    }
                }
            }
        });
    </script>
    {% block extra_js %}{% endblock %}
</body>
</html>
