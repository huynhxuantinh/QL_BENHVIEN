<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Đặt lịch</title>
</head>
<body>

<h2>Đặt lịch tại {{ benh_vien.ten }}</h2>

<hr>

<!-- CHỌN KHOA -->
<form method="get">

    <label>Chọn khoa:</label>

    <select name="khoa" onchange="this.form.submit()">

        <option value="">-- Chọn khoa --</option>

        {% for k in khoas %}
            <option value="{{ k.id }}"
                {% if k.id|stringformat:"s" == khoa_id %}
                    selected
                {% endif %}
            >
                {{ k.ten }}
            </option>
        {% endfor %}

    </select>

</form>

<hr>

<!-- FORM ĐẶT LỊCH -->
{% if bac_sis %}

<form method="post">

    {% csrf_token %}

    <div>
        <label>Bác sĩ</label><br>
        {{ form.bac_si }}
    </div>

    <br>

    <div>
        <label>Ngày khám</label><br>
        {{ form.ngay_kham }}
    </div>

    <br>

    <div>
        <label>Giờ khám</label><br>
        {{ form.gio_kham }}
    </div>

    <br>

    <div>
        <label>Ghi chú</label><br>
        {{ form.ghi_chu }}
    </div>

    <br>

    <button type="submit">
        Đặt lịch
    </button>

</form>

{% else %}

<p>👉 Vui lòng chọn khoa trước</p>

{% endif %}

<br>

<a href="/">← Về trang chủ</a>

</body>
</html>
